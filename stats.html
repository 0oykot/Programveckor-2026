<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats Page</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="drop">
      <div class="hamburger">
        <p>☰ Menu</p>
      </div>
      <div class="dropdown-content">
        <nav>
          <ul>
            <a class="navlink" href="index.html">Home</a>
            <a class="navlink" href="assignment.html">Assignments</a>
            <a class="navlink" href="stats.html">Current stats</a>
            <a class="navlink" href="character.html">Character</a>
          </ul>
        </nav>
      </div>
    </div>

    <img src="icon-gubbe.png">

  </header>

  <main>
    <section class="points-section">
      <div class="points-status">
        <h2>Points status: 9999</h2>
        <p class="subtitle">To get more points:</p>
        <ul class="points-list">
          <li>Complete Assignments!</li>
          <li>Do Daily Quests!</li>
          <li>Practice Using Flashcards!</li>
        </ul>
      </div>
    </section>

    <section class="buttons-section">
      <button class="action-btn">My assignments</button>
      <button class="action-btn"><a href="assignment.html">Daily quest</a></button>
    </section>

    <section class="streak-section">
      <div class="streak-container">
        <h2>streak</h2>
        <div class="streak-display">
          <span class="streak-number">46</span>
          <span class="fire-icon">🔥</span>
        </div>
      </div>
    </section>
  </main>

  <footer>&copy; 2026 programveckor</footer>
