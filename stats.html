<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <button class="menu-btn">
            <span>Menu</span>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>
        <div class="user-icon">👶🏿</div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Points status</h2>
            <p>To get more points:</p>
            <div class="points-list">
                <ul>
                    <li>Complete Daily Quests!</li>
                    <li>Complete Assignments!</li>
                    <li>Unlock Acheievments!</li>
                </ul>
            </div>
        </div>

        <div class="button-card">my assignments</div>

        <div class="card">
            <h2>streak</h2>
            <div class="streak-number">
                46 <span class="fire-icon">🔥</span>
            </div>
        </div>

        <div class="button-card">daily quest</div>
    </div>
</body>
</html>
